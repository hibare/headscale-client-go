name: Checks
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  schedule:
    - cron: "0 6 * * 6"

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read # for actions/checkout to fetch code
      pull-requests: read # for golangci/golangci-lint-action to fetch pull requests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          install-only: true
          version: v2.15.0

      - name: Install gh actions-lock extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock

      - name: Run pre-commit hooks
        uses: hibare/.github/github/shared-workflows/pre-commit@v0.19.0
        env:
          GH_TOKEN: ${{ github.token }}

  e2e-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Run E2E tests (race)
        run: make e2e-test-race

  e2e-tests-pr:
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'schedule'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Run E2E tests (race)
        run: make e2e-test-race
