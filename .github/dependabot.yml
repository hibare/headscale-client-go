# Managed by Axon; manual edits will be overwritten.
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:30"
      timezone: "UTC"
    target-branch: "main"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    groups:
      actions:
        patterns:
          - "*"

  # Maintain dependencies for Go mods
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/e2e"
      - "/examples"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:30"
      timezone: "UTC"
    target-branch: "main"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    allow:
      - dependency-type: "direct"
    groups:
      go:
        patterns:
          - "*"

  # Maintain dependencies for pre-commit
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:30"
      timezone: "UTC"
    target-branch: "main"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    groups:
      pre-commit:
        patterns:
          - "*"
